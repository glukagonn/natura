<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Natura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#17321F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de chat a pantalla completa — banda de cordillera arriba, conversación al centro, compositor fijo abajo */
:root{
  --bg:#F3F1EA; --surface:#FFFFFF; --sand:#E9E2D2; --fg:#1E2621; --muted:#5D6861; --line:#DDDCD2;
  --forest:#2F5D3A; --forest-ink:#FFFFFF; --pine:#17321F; --fjord:#1C3A5E; --sos:#B3261E; --sos-bg:#FBEDEB;
  --chip:#FFFFFF; --chip-line:#C9D6CB;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Karla",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"PingFang SC","Noto Sans SC",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18221C; --sand:#212A23; --fg:#E9EEE8; --muted:#A1ACA4; --line:#2A3830;
  --forest:#7FB38C; --forest-ink:#0E1511; --pine:#0B140F; --fjord:#9DBBE0; --sos:#FF8A80; --sos-bg:#3A1A18;
  --chip:#18221C; --chip-line:#34463A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18221C; --sand:#212A23; --fg:#E9EEE8; --muted:#A1ACA4; --line:#2A3830;
  --forest:#7FB38C; --forest-ink:#0E1511; --pine:#0B140F; --fjord:#9DBBE0; --sos:#FF8A80; --sos-bg:#3A1A18;
  --chip:#18221C; --chip-line:#34463A; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--fjord);outline-offset:2px;border-radius:6px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:760px;margin:0 auto;background:var(--bg);position:relative}
@media (min-width:780px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* Header */
.top{position:relative;z-index:5;background:#17321F;color:#fff;padding-top:12px;padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top svg.ridge{position:absolute;left:0;right:0;bottom:0;width:100%;height:46px;opacity:.55;pointer-events:none}
.top-in{position:relative;display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:#2F5D3A;display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.av svg{width:24px;height:24px;stroke:#D5EBD9;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.who{min-width:0;flex:1}
.who h1{margin:0;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.05em;line-height:1;text-transform:uppercase}
.who p{margin:3px 0 0;font-size:13px;color:#C9D9CD;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:#7FD18F;flex:none}
.tbtn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:700;font-size:13.5px;letter-spacing:.03em;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.2)}
.tbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.langwrap{position:relative}
.langmenu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);padding:6px;min-width:170px;display:grid;gap:2px;z-index:20}
.langmenu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:15px}
.langmenu button:hover{background:var(--sand)}
.langmenu button[aria-checked="true"]{color:var(--forest);font-weight:700}
.langmenu small{font-family:var(--mono);color:var(--muted);font-size:12px}

/* Log */
.log{overflow-y:auto;overscroll-behavior:contain;padding-top:18px;padding-bottom:12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.day{align-self:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sand);padding:4px 10px;border-radius:999px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.row.me{justify-content:flex-end}
.row .mini{width:28px;height:28px;border-radius:50%;background:var(--forest);display:grid;place-items:center;flex:none}
.row .mini svg{width:15px;height:15px;stroke:var(--forest-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bub{max-width:min(86%,520px);padding:11px 14px;border-radius:18px;font-size:15.5px;line-height:1.55;overflow-wrap:anywhere;min-width:0}
.bot .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.me .bub{background:var(--forest);color:var(--forest-ink);border-bottom-right-radius:5px}
.bub strong{font-weight:700}
.bub .li{display:flex;gap:8px;margin-top:3px}
.bub .li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--forest);flex:none;margin-top:9px}
.bub .gap{height:8px}
.bub .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.95em}
.bub.sos{background:var(--sos-bg);border-color:color-mix(in srgb,var(--sos) 35%,transparent)}
.bub.sos strong{color:var(--sos)}
.time{font-size:11px;color:var(--muted);margin:0 4px 2px;font-family:var(--mono);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding-left:36px;margin-top:-2px}
.chip{border:1.5px solid var(--chip-line);background:var(--chip);color:var(--forest);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;line-height:1.25;text-align:left}
.chip:hover{border-color:var(--forest)}
.chip.sos{color:var(--sos);border-color:color-mix(in srgb,var(--sos) 45%,transparent)}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.45}
@media (prefers-reduced-motion:no-preference){
  .typing i{animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .row.new{animation:in .28s cubic-bezier(.2,.8,.2,1)}
}
@keyframes bl{50%{opacity:1;transform:translateY(-2px)}}
@keyframes in{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}

/* Topic grid (welcome) */
.topics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 4px 36px}
.topic{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px 10px;display:grid;justify-items:center;align-content:start;gap:6px;cursor:pointer;font-size:13px;font-weight:600;text-align:center;line-height:1.2;color:var(--fg);min-width:0}
.topic:hover{border-color:var(--forest)}
.topic span.e{font-size:22px;line-height:1}
.topic.sos{background:var(--sos-bg);border-color:color-mix(in srgb,var(--sos) 30%,transparent);color:var(--sos)}
@media (max-width:420px){.topics{gap:6px;margin-left:0}.topic{padding:10px 3px 8px;font-size:12px}.chips{padding-left:0}}

/* Composer */
.composer{background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.composer form{display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:12px 16px;font-size:16px;outline:none}
.composer input:focus{border-color:var(--forest)}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--forest);color:var(--forest-ink);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s}
.send:active{transform:scale(.94)}
.send svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:7px;font-family:var(--mono);letter-spacing:.02em}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <svg class="ridge" viewBox="0 0 400 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 46L0 34L40 22L70 30L110 8L130 16L150 4L172 18L200 12L240 30L270 20L300 28L340 10L370 24L400 18L400 46Z" fill="#2F5D3A"/><path d="M0 46L0 40L60 32L120 38L180 30L260 38L330 32L400 36L400 46Z" fill="#244A2E"/></svg>
    <div class="top-in">
      <div class="av" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.2-6.1C9.6 14.4 12 13 13 11"/></svg></div>
      <div class="who"><h1>Natura</h1><p><span class="dot"></span><span id="status">En línea · Nature’s Towers</span></p></div>
      <div class="langwrap">
        <button class="tbtn" type="button" id="langBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="langMenu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span id="langCode">ES</span></button>
        <div class="langmenu" id="langMenu" role="menu" hidden></div>
      </div>
      <button class="tbtn" type="button" id="reset" aria-label="Nuevo chat" title="Nuevo chat"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
  </header>

  <main class="log" id="log" aria-live="polite"></main>

  <footer class="composer">
    <form id="form" autocomplete="off">
      <input id="q" name="q" type="text" enterkeyhint="send" placeholder="Escribe tu pregunta…" aria-label="Escribe tu pregunta" maxlength="300">
      <button class="send" id="sendBtn" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
    </form>
    <div class="foot" id="foot">Natura · Nature’s Towers × Dreamers Travel · prototipo académico</div>
  </footer>
</div>

<script>
(function(){
"use strict";
const LANGS=['es','en','pt','zh'];
const P=(l,o)=>o[l]!==undefined?o[l]:o.en;

/* =========================================================
   DATOS DE NATURE'S TOWERS
   ========================================================= */
const D={
  domo:{price:1670,cap:[2,7],units:10,in:'15:30',out:'10:30',cuotas:3},
  cab:{adult:145,kid:110,minAge:12,group:[5,7],hours:3,cuotas:2,advance:10,
    seasons:[['2026-11-01','2027-03-31',{es:'Primavera y verano',en:'Spring & summer',pt:'Primavera e verão',zh:'春夏季'}],
             ['2027-04-01','2027-04-30',{es:'Otoño',en:'Autumn',pt:'Outono',zh:'秋季'}],
             ['2027-10-15','2027-10-31',{es:'Primavera',en:'Spring',pt:'Primavera',zh:'春季'}]]},
  transport:{price:1200,hours:'8–10'}
};
const money=n=>'US$'+Math.round(n).toLocaleString('en-US');
const MN={es:['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
          en:['January','February','March','April','May','June','July','August','September','October','November','December'],
          pt:['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']};
function fmtDate(iso,l){const [y,m,d]=iso.split('-').map(Number);
  return P(l,{es:`${d} de ${MN.es[m-1]} de ${y}`,en:`${MN.en[m-1]} ${d}, ${y}`,pt:`${d} de ${MN.pt[m-1]} de ${y}`,zh:`${y}年${m}月${d}日`})}
function monthLabel(m,y,l){return P(l,{es:`en ${MN.es[m-1]} de ${y}`,en:`in ${MN.en[m-1]} ${y}`,pt:`em ${MN.pt[m-1]} de ${y}`,zh:`${y}年${m}月`})}
function todayISO(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}

/* =========================================================
   NORMALIZACIÓN + ENTIDADES
   ========================================================= */
const CJK=/[一-鿿]/;
const ZHNUM={'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function zhNums(s){
  return s.replace(/([一二两三四五六七八九]?)十([一二三四五六七八九]?)/g,(m,a,b)=>String((a?ZHNUM[a]:1)*10+(b?ZHNUM[b]:0)))
          .replace(/[一二两三四五六七八九](?=\s*(?:个|位|岁|月|人|大人|成人|孩子|小孩|儿童|号))/g,c=>String(ZHNUM[c]));
}
function norm(s){
  let t=zhNums(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  t=t.replace(/[^a-z0-9:$ 一-鿿]+/g,' ').replace(/([一-鿿])([a-z0-9])/g,'$1 $2').replace(/([a-z0-9])([一-鿿])/g,'$1 $2');
  return ' '+t.replace(/\s+/g,' ').trim()+' ';
}
const NUMW={un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,
  one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,couple:2,pareja:2,
  um:1,duas:2,dois:2,quatro:4,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15};
function withDigits(n){return n.replace(/ ([a-z]+)(?= )/g,(m,w)=>NUMW[w]?' '+NUMW[w]:m)}
const MONTHS={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12,
  january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,
  janeiro:1,fevereiro:2,marco:3,maio:5,junho:6,julho:7,setembro:9,outubro:10,novembro:11,dezembro:12};
function entities(n){
  const d=withDigits(n), e={};let m;
  if((m=d.match(/ (\d+) (?:adultos?|grandes|mayores|adults?|grown ?ups?) /))||(m=d.match(/(\d+) ?(?:个|位)?(?:大人|成人|成年人)/)))e.adults=+m[1];
  if((m=d.match(/ (\d+) (?:ninos?|ninas?|hijos?|hijas?|menores|chicos?|chicas?|kids?|children|childs?|teens?|adolescentes?|criancas?|filhos?|filhas?) /))||(m=d.match(/(\d+) ?(?:个|位)?(?:孩子|小孩|儿童|小朋友)/)))e.kids=+m[1];
  if((m=d.match(/ (?:somos|seremos|vamos|para|we are|were|we re|for|grupo de|group of) (\d+) /))||(m=d.match(/ (\d+) (?:personas?|pessoas?|pax|people|persons?|viajeros?|viajantes?|huespedes|hospedes|guests?|travelers?|amigos?|friends) /))||(m=d.match(/(?:我们|一共|共)? ?(\d+) ?(?:个|位)?人/)))e.people=+m[1];
  if((m=d.match(/ (\d+) (?:anos?|years?|yo) /))||(m=d.match(/ (?:tiene|tengo|tem|tenho|edad de|idade de|age|aged|is) (\d+) /))||(m=d.match(/ (?:ninos?|ninas?|hijos?|hijas?|kids?|children|child|son|daughter|criancas?|filhos?|filhas?|menores?) (?:de|of|aged|com) (\d+) /))||(m=d.match(/(\d+) ?岁/)))e.age=+m[1];
  for(const k in MONTHS){if(n.includes(' '+k+' ')){e.month=MONTHS[k];break}}
  if(!e.month&&(m=d.match(/(\d{1,2}) ?月/))&&+m[1]>=1&&+m[1]<=12)e.month=+m[1];
  if(/ (hoy|ahora|esta semana|today|now|this week|tonight|hoje|agora|esta noite) /.test(n)||/今天|现在|今晚|本周/.test(n))e.now=true;
  return e;
}
function detectLang(n,cur){
  if(CJK.test(n))return 'zh';
  const W={
    en:' the is what how much do does can i you where when are there my your have has horse price hello hi thanks thank please which any need bring weather food dome tell me about we our am lost to of and it this with get is i im ',
    es:' el la cuanto donde cuando hay puedo mi los las es hola gracias tienen se cual necesito llevar cuentame sobre por favor quiero hora cuesta ninos nino caballo cabalgata ',
    pt:' voce vc nao tem posso qual obrigado obrigada ola oi preco quanto custa cavalgada cavalo meu minha sao tambem ate onde hoje amanha quero criancas crianca levar roupa tchau valeu e um uma da do no na pra pro sobre fala tempo cafe o os as em eu vir fazer trilha inclui horas '
  };
  const sets={};for(const k in W)sets[k]=new Set(W[k].trim().split(' '));
  const sc={en:0,es:0,pt:0};const toks=n.trim().split(' ');
  toks.forEach(w=>{for(const k in sc)if(sets[k].has(w))sc[k]++});
  // palabras que solo existen en un idioma pesan más
  const only={pt:['voce','nao','obrigado','obrigada','oi','preco','custa','cavalgada','cavalo','tambem','hoje','amanha','criancas','crianca','tchau','valeu','pra','meu','minha','sao','tem','posso','quanto','onde','fala','cafe','eu','na','no','do','da','em','um','uma','vir','fazer','trilha','inclui','ola','oi','o','dicas','seguranca','voces','estou','ser','faz','muito','precisa','tenho','pode','vou','gostaria','cavalgar','cavalgadas'],
              es:['cuanto','cuesta','hola','gracias','hay','puedo','cabalgata','caballo','ninos','nino','donde','cuentame','tienen','necesito'],
              en:['the','what','how','does','thanks','hello','hi','please','which','bring','weather','horse','price','much','i','am','lost','is','are','my','can','there','you','your']};
  // 'o' en español es 'u otro'; en portugués es artículo. Le damos peso moderado
  if(toks.includes('o'))sc.pt-=1;
  toks.forEach(w=>{for(const k in only)if(only[k].includes(w))sc[k]+=1.5});
  const best=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  if(best[0][1]>=1&&best[0][1]>best[1][1])return best[0][0];
  return cur;
}

/* =========================================================
   COINCIDENCIA DIFUSA
   ========================================================= */
const STOP=new Set('cuanto cuanta cuantos cuando donde puedo puede tiene tienen hay para como que esta este estan sale salen hace the what when where how much does have can quanto quando onde posso pode tem voce esta sao'.split(' '));
function stem(w){if(w.length>5&&w.endsWith('es'))return w.slice(0,-2);if(w.length>3&&w.endsWith('s'))return w.slice(0,-1);return w}
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;const v=new Array(b.length+1);for(let j=0;j<=b.length;j++)v[j]=j;
  for(let i=1;i<=a.length;i++){let prev=v[0];v[0]=i;let rowMin=v[0];for(let j=1;j<=b.length;j++){const tmp=v[j];v[j]=Math.min(v[j]+1,v[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=tmp;if(v[j]<rowMin)rowMin=v[j]}if(rowMin>max)return max+1}return v[b.length]}
function compile(spec){return spec.split('|').filter(Boolean).map(s=>{const i=s.lastIndexOf(':');const k=i>0&&/^\d+$/.test(s.slice(i+1))?s.slice(0,i):s;const w=k===s?1:+s.slice(i+1);

function domoCalc(l,e){
  const n=e.people||((e.adults||0)+(e.kids||0));if(!n)return '';const [mn,mx]=D.domo.cap;
  if(n<mn)return '\n\n'+P(l,{es:`🧮 El domo es para ${mn} a ${mx} personas y se reserva completo: ${money(D.domo.price)}.`,en:`🧮 Domes host ${mn} to ${mx} people and are booked whole: ${money(D.domo.price)}.`,pt:`🧮 O domo é para ${mn} a ${mx} pessoas e é reservado inteiro: ${money(D.domo.price)}.`,zh:`🧮 每个圆顶可住${mn}至${mx}人，整顶预订：${money(D.domo.price)}。`});
  const u=Math.ceil(n/mx),tot=u*D.domo.price;
  if(u>D.domo.units)return '\n\n'+P(l,{es:`🧮 Para ${n} personas se necesitarían más de ${D.domo.units} domos. Consulta en recepción para grupos grandes.`,en:`🧮 ${n} people would need more than ${D.domo.units} domes. Please ask reception about large groups.`,pt:`🧮 Para ${n} pessoas seriam necessários mais de ${D.domo.units} domos. Consulte a recepção para grupos grandes.`,zh:`🧮 ${n}人需要超过${D.domo.units}个圆顶，大团体请咨询前台。`});
  return '\n\n'+P(l,{es:`🧮 **Para ${n} personas:** ${u} domo${u>1?'s':''} → **${money(tot)}** (≈ ${money(tot/n)} por persona), o 3 cuotas de ${money(tot/3)}.`,
    en:`🧮 **For ${n} people:** ${u} dome${u>1?'s':''} → **${money(tot)}** (≈ ${money(tot/n)} per person), or 3 installments of ${money(tot/3)}.`,
    pt:`🧮 **Para ${n} pessoas:** ${u} domo${u>1?'s':''} → **${money(tot)}** (≈ ${money(tot/n)} por pessoa), ou 3 parcelas de ${money(tot/3)}.`,
    zh:`🧮 **${n}人：** 需要${u}个圆顶 → **${money(tot)}**（每人约${money(tot/n)}），或分3期，每期${money(tot/3)}。`});
}
function ageCheck(l,e){
  if(e.age==null)return '';const a=e.age,m=D.cab.minAge;
  if(a<m)return '\n\n'+P(l,{es:`❌ Con **${a} años** todavía no puede participar: la edad mínima es ${m} años.`,en:`❌ At **${a} years old** they can’t join yet: the minimum age is ${m}.`,pt:`❌ Com **${a} anos** ainda não pode participar: a idade mínima é ${m} anos.`,zh:`❌ **${a}岁**暂时不能参加：最低年龄为${m}岁。`});
  if(a<18)return '\n\n'+P(l,{es:`✅ Con **${a} años** sí puede ir, presentando la autorización correspondiente por ser menor de edad. Tarifa niño: ${money(D.cab.kid)}.`,en:`✅ At **${a}** they can join, with the required authorization for minors. Child rate: ${money(D.cab.kid)}.`,pt:`✅ Com **${a} anos** pode participar, apresentando a autorização exigida para menores. Tarifa criança: ${money(D.cab.kid)}.`,zh:`✅ **${a}岁**可以参加，未成年人需出示相应的授权书。儿童价格：${money(D.cab.kid)}。`});
  return '\n\n'+P(l,{es:`✅ Con ${a} años sí puede participar (tarifa adulto ${money(D.cab.adult)}).`,en:`✅ At ${a} they can join (adult rate ${money(D.cab.adult)}).`,pt:`✅ Com ${a} anos pode participar (tarifa adulto ${money(D.cab.adult)}).`,zh:`✅ ${a}岁可以参加（成人价格${money(D.cab.adult)}）。`});
}

  thanks:l=>P(l,{es:`¡Con gusto! 🌿 Si necesitas algo más, aquí estoy. Que disfrutes la Patagonia.`,en:`You’re welcome! 🌿 I’m here if you need anything else. Enjoy Patagonia.`,pt:`De nada! 🌿 Se precisar de mais alguma coisa, estou aqui. Aproveite a Patagônia.`,zh:`不客气！🌿 还有需要随时问我。祝您在巴塔哥尼亚玩得开心。`}),

  who:l=>P(l,{es:`Soy **Natura** 🌿, el asistente virtual de Nature’s Towers. Te ayudo antes, durante y después de tu estadía con:\n• Domos, horarios y qué incluye\n• Cabalgata, tarifas y temporadas\n• Comidas, Wi-Fi y normas\n• Clima, qué llevar y seguridad\n• Emergencias\n\nEscribe tu pregunta en español, inglés, portugués o chino.`,
    en:`I’m **Natura** 🌿, the Nature’s Towers virtual assistant. I can help before, during and after your stay with:\n• Domes, times and what’s included\n• Horseback ride, rates and seasons\n• Meals, Wi-Fi and house rules\n• Weather, what to bring and safety\n• Emergencies\n\nAsk me in English, Spanish, Portuguese or Chinese.`,
    pt:`Sou a **Natura** 🌿, a assistente virtual da Nature’s Towers. Posso ajudar antes, durante e depois da sua estadia com:\n• Domos, horários e o que está incluído\n• Cavalgada, tarifas e temporadas\n• Refeições, Wi-Fi e regras\n• Clima, o que levar e segurança\n• Emergências\n\nPergunte em português, espanhol, inglês ou chinês.`,
    zh:`我是**Natura** 🌿，Nature’s Towers 的虚拟助手。在您入住前、入住期间和离开后，我可以帮您了解：\n• 圆顶屋、时间和包含内容\n• 骑马活动、价格和季节\n• 餐食、Wi-Fi和规定\n• 天气、携带物品和安全\n• 紧急情况\n\n可以用中文、英语、西班牙语或葡萄牙语提问。`}),
  help:l=>P(l,{es:`Elige un tema o escribe tu pregunta 👇`,en:`Pick a topic or type your question 👇`,pt:`Escolha um tema ou escreva sua pergunta 👇`,zh:`请选择一个主题或直接输入问题 👇`}),
  food:l=>P(l,{es:`🍽️ **Comidas incluidas en tu estadía**\n• Desayuno continental diario\n• Cena servida en tu domo\n\nSi tienes una dieta especial (vegetariana, vegana, sin gluten) o alguna alergia, avísalo en recepción. Para almuerzos o snacks para el sendero, consulta también en recepción.`,
    en:`🍽️ **Meals included in your stay**\n• Daily continental breakfast\n• Dinner served in your dome\n\nIf you have a special diet (vegetarian, vegan, gluten-free) or an allergy, let reception know. For lunch or trail snacks, also ask at reception.`,
    pt:`🍽️ **Refeições incluídas na estadia**\n• Café da manhã continental diário\n• Jantar servido no seu domo\n\nSe você tem uma dieta especial (vegetariana, vegana, sem glúten) ou alguma alergia, avise a recepção. Para almoço ou lanches para a trilha, consulte também a recepção.`,
    zh:`🍽️ **住宿包含的餐食**\n• 每日欧陆式早餐\n• 送到圆顶的晚餐\n\n如有特殊饮食（素食、纯素、无麸质）或过敏，请告知前台。午餐或徒步零食也请咨询前台。`}),
  wifi:l=>P(l,{es:`📶 **Sí, hay Wi-Fi** en las instalaciones de Nature’s Towers. Pide la clave en recepción.\n\nDentro del parque la señal de celular es muy limitada, así que descarga tus mapas antes de salir.`,en:`📶 **Yes, there’s Wi-Fi** on the Nature’s Towers premises. Ask reception for the password.\n\nInside the park, mobile signal is very limited, so download your maps before heading out.`,pt:`📶 **Sim, tem Wi-Fi** nas instalações da Nature’s Towers. Peça a senha na recepção.\n\nDentro do parque o sinal de celular é muito limitado, então baixe seus mapas antes de sair.`,zh:`📶 **有Wi-Fi**，覆盖Nature’s Towers营地。密码请向前台索取。\n\n公园内手机信号非常有限，出发前请先下载离线地图。`}),
  signal:l=>P(l,{es:`📵 La señal de celular en Torres del Paine es **muy limitada** y en muchos senderos no hay cobertura.\n• En Nature’s Towers tienes Wi-Fi\n• Descarga mapas sin conexión antes de salir\n• Avisa en recepción tu ruta y hora de regreso`,en:`📵 Mobile signal in Torres del Paine is **very limited**, and many trails have no coverage.\n• Nature’s Towers has Wi-Fi\n• Download offline maps before heading out\n• Tell reception your route and return time`,pt:`📵 O sinal de celular em Torres del Paine é **muito limitado** e muitas trilhas não têm cobertura.\n• Na Nature’s Towers tem Wi-Fi\n• Baixe mapas offline antes de sair\n• Avise a recepção sobre sua rota e horário de volta`,zh:`📵 百内国家公园的手机信号**非常有限**，许多步道没有信号。\n• Nature’s Towers 有Wi-Fi\n• 出发前下载离线地图\n• 告知前台您的路线和返回时间`}),
  parking:l=>P(l,{es:`🅿️ **Sí, hay estacionamiento privado** incluido en tu estadía.`,en:`🅿️ **Yes, private parking** is included in your stay.`,pt:`🅿️ **Sim, tem estacionamento privado** incluído na estadia.`,zh:`🅿️ **有私人停车位**，已包含在住宿中。`}),
  pets:l=>P(l,{es:`🐾 Lo sentimos: **no se admiten mascotas** en Nature’s Towers.`,en:`🐾 Sorry: **pets are not allowed** at Nature’s Towers.`,pt:`🐾 Desculpe: **não aceitamos animais de estimação** na Nature’s Towers.`,zh:`🐾 抱歉：Nature’s Towers **不允许携带宠物**。`}),
  smoke:l=>P(l,{es:`🚭 **No se permite fumar** dentro de los domos ni en ninguna parte del recinto. Gracias por cuidar el entorno.`,en:`🚭 **Smoking is not allowed** inside the domes or anywhere on site. Thanks for protecting this place.`,pt:`🚭 **É proibido fumar** dentro dos domos e em qualquer parte do local. Obrigado por cuidar do ambiente.`,zh:`🚭 圆顶内及营地任何地方**禁止吸烟**。感谢您爱护环境。`}),
  weather:l=>P(l,{es:`🌦️ **El clima patagónico cambia muy rápido**, incluso varias veces en un día.\n• En temporada alta (dic–feb) las temperaturas suelen ir de 2 a 18 °C\n• El viento puede superar los 80 km/h\n• Puede llover o nevar en cualquier época\n\nVístete por capas y pregunta el pronóstico del día en recepción. La cabalgata puede suspenderse por mal tiempo.`,
    en:`🌦️ **Patagonian weather changes fast**, sometimes several times a day.\n• In high season (Dec–Feb) temperatures usually range from 2 to 18 °C (36–64 °F)\n• Wind can exceed 80 km/h (50 mph)\n• Rain or snow is possible any time of year\n\nDress in layers and ask reception for today’s forecast. The horseback ride may be suspended in bad weather.`,
    pt:`🌦️ **O clima da Patagônia muda muito rápido**, às vezes várias vezes no mesmo dia.\n• Na alta temporada (dez–fev) as temperaturas costumam ficar entre 2 e 18 °C\n• O vento pode passar de 80 km/h\n• Pode chover ou nevar em qualquer época\n\nVista-se em camadas e pergunte a previsão do dia na recepção. A cavalgada pode ser suspensa por mau tempo.`,
    zh:`🌦️ **巴塔哥尼亚的天气变化很快**，一天之内可能变好几次。\n• 旺季（12月至2月）气温通常在2至18°C之间\n• 风速可超过每小时80公里\n• 任何季节都可能下雨或下雪\n\n请多层穿衣，并向前台询问当天的天气预报。天气恶劣时骑马活动可能取消。`}),
  pack:l=>P(l,{es:`🎒 **Qué llevar**\n• Chaqueta impermeable y cortaviento\n• Capa térmica (polar o pluma)\n• Gorro, guantes y buff\n• Botas de trekking ya usadas\n• Bloqueador solar y lentes de sol\n• Botella reutilizable\n• Mochila pequeña para el día\n\n🐎 **Para la cabalgata:** pantalón largo y zapatos cerrados. El casco te lo entregamos.`,
    en:`🎒 **What to bring**\n• Waterproof, windproof jacket\n• Warm layer (fleece or down)\n• Hat, gloves and neck gaiter\n• Broken-in hiking boots\n• Sunscreen and sunglasses\n• Reusable water bottle\n• Small daypack\n\n🐎 **For the horseback ride:** long pants and closed shoes. We provide the helmet.`,
    pt:`🎒 **O que levar**\n• Jaqueta impermeável e corta-vento\n• Camada térmica (fleece ou pluma)\n• Gorro, luvas e bandana de pescoço\n• Botas de trilha já amaciadas\n• Protetor solar e óculos de sol\n• Garrafa reutilizável\n• Mochila pequena para o dia\n\n🐎 **Para a cavalgada:** calça comprida e sapato fechado. O capacete nós fornecemos.`,
    zh:`🎒 **需要携带的物品**\n• 防水防风外套\n• 保暖层（抓绒或羽绒）\n• 帽子、手套和围脖\n• 穿惯的徒步鞋\n• 防晒霜和太阳镜\n• 可重复使用的水瓶\n• 小型日用背包\n\n🐎 **骑马时：** 请穿长裤和包头鞋。头盔由我们提供。`}),
  sos:l=>({sos:true,text:P(l,{es:`🆘 **En una emergencia**\n• **131** Ambulancia (SAMU)\n• **132** Bomberos\n• **133** Carabineros\n\n1. Mantén la calma y quédate en un lugar seguro.\n2. Si no tienes señal, avisa a tu guía, a otros excursionistas o a un guardaparques.\n3. Si estás en Nature’s Towers, acude de inmediato a recepción.\n4. No te separes del sendero ni de tu grupo.`,
    en:`🆘 **In an emergency (Chile)**\n• **131** Ambulance (SAMU)\n• **132** Fire department\n• **133** Police (Carabineros)\n\n1. Stay calm and move to a safe spot.\n2. If you have no signal, tell your guide, other hikers or a park ranger.\n3. If you’re at Nature’s Towers, go to reception right away.\n4. Don’t leave the trail or your group.`,
    pt:`🆘 **Em uma emergência (Chile)**\n• **131** Ambulância (SAMU)\n• **132** Bombeiros\n• **133** Polícia (Carabineros)\n\n1. Mantenha a calma e fique em um lugar seguro.\n2. Se não tiver sinal, avise seu guia, outros caminhantes ou um guarda-parque.\n3. Se estiver na Nature’s Towers, vá imediatamente à recepção.\n4. Não saia da trilha nem se separe do grupo.`,
    zh:`🆘 **紧急情况（智利）**\n• **131** 救护车（SAMU）\n• **132** 消防\n• **133** 警察（Carabineros）\n\n1. 保持冷静，待在安全的地方。\n2. 如果没有信号，请告知向导、其他徒步者或公园护林员。\n3. 如果您在Nature’s Towers，请立即前往前台。\n4. 不要离开步道或团队。`})}),
  wildlife:l=>P(l,{es:`🦙 En Torres del Paine puedes ver guanacos, cóndores, ñandúes, zorros y, con suerte, pumas.\n\n**Si ves un puma:**\n• No corras ni le des la espalda\n• Mantén a los niños a tu lado\n• Hazte ver grande y retrocede despacio\n\nNunca alimentes a los animales y mantén la distancia.`,
    en:`🦙 In Torres del Paine you can spot guanacos, condors, rheas, foxes and, if you’re lucky, pumas.\n\n**If you see a puma:**\n• Don’t run or turn your back\n• Keep children close\n• Make yourself look big and back away slowly\n\nNever feed wildlife and keep your distance.`,
    pt:`🦙 Em Torres del Paine você pode ver guanacos, condores, emas, raposas e, com sorte, pumas.\n\n**Se você vir um puma:**\n• Não corra nem dê as costas\n• Mantenha as crianças perto de você\n• Pareça maior e recue devagar\n\nNunca alimente os animais e mantenha distância.`,
    zh:`🦙 在百内国家公园可以看到原驼、秃鹰、美洲鸵、狐狸，运气好还能看到美洲狮。\n\n**如果遇到美洲狮：**\n• 不要跑，也不要背对它\n• 让孩子待在身边\n• 让自己显得高大，慢慢后退\n\n请勿喂食野生动物，并保持距离。`}),
  green:l=>P(l,{es:`🌿 **Turismo responsable**\n• 🔥 Está prohibido hacer fuego en el parque\n• Llévate toda tu basura de vuelta\n• Camina solo por senderos marcados\n• No alimentes a la fauna\n• Usa botella reutilizable`,en:`🌿 **Responsible travel**\n• 🔥 Fires are prohibited in the park\n• Pack out all your trash\n• Stay on marked trails\n• Don’t feed wildlife\n• Use a reusable bottle`,pt:`🌿 **Turismo responsável**\n• 🔥 É proibido fazer fogo no parque\n• Leve todo o seu lixo de volta\n• Caminhe só pelas trilhas sinalizadas\n• Não alimente os animais\n• Use garrafa reutilizável`,zh:`🌿 **负责任的旅行**\n• 🔥 公园内禁止生火\n• 带走所有垃圾\n• 只走标记的步道\n• 不要喂食野生动物\n• 使用可重复使用的水瓶`}),
  safety:l=>P(l,{es:`🧭 **Consejos de seguridad**\n• Avisa en recepción tu ruta y hora de regreso\n• Revisa el pronóstico antes de salir\n• No camines solo al atardecer\n• Lleva agua, abrigo y snacks\n• Con viento muy fuerte, agáchate y aléjate de los bordes\n\nEn una emergencia, escribe «emergencia».`,en:`🧭 **Safety tips**\n• Tell reception your route and return time\n• Check the forecast before heading out\n• Don’t hike alone at dusk\n• Bring water, warm layers and snacks\n• In very strong wind, crouch down and stay away from edges\n\nIn an emergency, type “emergency”.`,pt:`🧭 **Dicas de segurança**\n• Avise a recepção sobre sua rota e horário de volta\n• Confira a previsão antes de sair\n• Não caminhe sozinho ao entardecer\n• Leve água, agasalho e lanches\n• Com vento muito forte, abaixe-se e afaste-se das bordas\n\nEm uma emergência, escreva «emergência».`,zh:`🧭 **安全提示**\n• 告知前台您的路线和返回时间\n• 出发前查看天气预报\n• 黄昏时不要独自徒步\n• 带上水、保暖衣物和零食\n• 遇到强风请蹲低并远离边缘\n\n紧急情况请输入“紧急”。`}),
  experience:l=>P(l,{es:`🐎 **No necesitas experiencia previa** para la cabalgata. Antes de comenzar recibes instrucciones básicas y el equipo de seguridad, y te acompañan un guía especializado y baqueanos.`,en:`🐎 **No riding experience needed.** Before starting you get basic instructions and safety gear, and a specialist guide and baqueanos ride with you.`,pt:`🐎 **Não precisa de experiência** para a cavalgada. Antes de começar você recebe instruções básicas e equipamento de segurança, e vai acompanhado por um guia especializado e baqueanos.`,zh:`🐎 **骑马无需经验。** 出发前会有基本讲解并提供安全装备，全程由专业向导和当地牧马人陪同。`}),
  base:l=>P(l,{es:`🏔️ **Mirador Base Torres**: las tres torres de granito sobre una laguna glaciar, el ícono del parque. Son ≈ 19 km ida y vuelta (8–10 horas), con una subida final exigente.\n\nLas excursiones guiadas no están incluidas en el domo. Dreamers Travel la incluye en sus paquetes del Circuito W y O.`,en:`🏔️ **Base Torres viewpoint**: three granite towers above a glacial lagoon, the park’s icon. ≈ 19 km round trip (8–10 hours), with a steep final climb.\n\nGuided tours aren’t included with the dome. Dreamers Travel includes it in its W and O trek packages.`,pt:`🏔️ **Mirante Base Torres**: as três torres de granito sobre uma lagoa glacial, o ícone do parque. São ≈ 19 km ida e volta (8–10 horas), com uma subida final exigente.\n\nPasseios guiados não estão incluídos no domo. A Dreamers Travel inclui esse passeio nos pacotes do Circuito W e O.`,zh:`🏔️ **三塔观景台（Base Torres）**：冰川湖上方的三座花岗岩塔峰，是公园的标志。往返约19公里（8–10小时），最后一段上坡较陡。\n\n圆顶住宿不含导览游。Dreamers Travel 的W线和O线套餐包含此行程。`}),
  grey:l=>P(l,{es:`🧊 **Glaciar Grey**: paredes de hielo azul del Campo de Hielo Patagónico Sur, con témpanos flotando en el lago Grey. Se puede ver desde miradores en el sendero o en navegación.\n\nPide información de excursiones en recepción.`,en:`🧊 **Grey Glacier**: blue ice walls from the Southern Patagonian Ice Field, with icebergs floating on Lake Grey. You can see it from trail viewpoints or on a boat trip.\n\nAsk reception about excursions.`,pt:`🧊 **Geleira Grey**: paredes de gelo azul do Campo de Gelo Patagônico Sul, com icebergs flutuando no lago Grey. Dá para ver de mirantes na trilha ou em passeio de barco.\n\nPeça informações sobre passeios na recepção.`,zh:`🧊 **格雷冰川**：来自南巴塔哥尼亚冰原的蓝色冰墙，格雷湖上漂浮着浮冰。可在步道观景点或乘船观赏。\n\n游览信息请咨询前台。`}),
  frances:l=>P(l,{es:`⛰️ **Valle del Francés**: un anfiteatro rodeado por los Cuernos del Paine y glaciares colgantes. Es parte del Circuito W.\n\nPide información de excursiones en recepción.`,en:`⛰️ **French Valley**: an amphitheater surrounded by the Cuernos del Paine and hanging glaciers. It’s part of the W Trek.\n\nAsk reception about excursions.`,pt:`⛰️ **Vale do Francês**: um anfiteatro cercado pelos Cuernos del Paine e geleiras suspensas. Faz parte do Circuito W.\n\nPeça informações sobre passeios na recepção.`,zh:`⛰️ **法国谷**：被潘恩角峰和悬冰川环绕的圆形山谷，是W线的一部分。\n\n游览信息请咨询前台。`}),
  todo:l=>P(l,{es:`🥾 **Qué hacer desde Nature’s Towers**\n• 🐎 Cabalgata por la estepa (≈ 3 h)\n• 🏔️ Mirador Base Torres\n• 🧊 Glaciar Grey\n• ⛰️ Valle del Francés\n• 🦙 Observación de fauna\n\nLas excursiones guiadas al parque se contratan aparte. ¿De cuál quieres saber más?`,en:`🥾 **Things to do from Nature’s Towers**\n• 🐎 Horseback ride on the steppe (≈ 3 h)\n• 🏔️ Base Torres viewpoint\n• 🧊 Grey Glacier\n• ⛰️ French Valley\n• 🦙 Wildlife watching\n\nGuided park tours are booked separately. Which one would you like to know more about?`,pt:`🥾 **O que fazer a partir da Nature’s Towers**\n• 🐎 Cavalgada pela estepe (≈ 3 h)\n• 🏔️ Mirante Base Torres\n• 🧊 Geleira Grey\n• ⛰️ Vale do Francês\n• 🦙 Observação de fauna\n\nOs passeios guiados no parque são contratados à parte. Sobre qual você quer saber mais?`,zh:`🥾 **从Nature’s Towers出发可以做什么**\n• 🐎 草原骑马（约3小时）\n• 🏔️ 三塔观景台\n• 🧊 格雷冰川\n• ⛰️ 法国谷\n• 🦙 观赏野生动物\n\n公园导览游需另行预订。您想了解哪一个？`}),
  reception:l=>P(l,{es:`🛎️ Nature’s Towers tiene **recepción y asistencia turística** incluida en tu estadía. Acércate cuando quieras para reservas, pronóstico, excursiones o cualquier problema.`,en:`🛎️ Nature’s Towers offers **reception and tourist assistance** as part of your stay. Drop by anytime for bookings, forecasts, excursions or any issue.`,pt:`🛎️ A Nature’s Towers tem **recepção e assistência turística** incluídas na estadia. Passe lá quando quiser para reservas, previsão do tempo, passeios ou qualquer problema.`,zh:`🛎️ Nature’s Towers 的住宿包含**前台及旅游协助**。预订、天气预报、游览或任何问题都可以随时到前台咨询。`}),
  dreamers:l=>P(l,{es:`🤝 **Dreamers Travel** es la agencia de viajes que organiza experiencias de aventura y naturaleza en Torres del Paine. Nature’s Towers es su alojamiento asociado, y yo soy el asistente del ecocamp.`,en:`🤝 **Dreamers Travel** is the travel agency that organizes adventure and nature experiences in Torres del Paine. Nature’s Towers is its partner lodging, and I’m the ecocamp’s assistant.`,pt:`🤝 A **Dreamers Travel** é a agência de viagens que organiza experiências de aventura e natureza em Torres del Paine. A Nature’s Towers é sua hospedagem parceira, e eu sou a assistente do ecocamp.`,zh:`🤝 **Dreamers Travel** 是在百内国家公园组织探险与自然体验的旅行社。Nature’s Towers 是其合作住宿，我是营地的助手。`})+'\n\n'+T.pkgs.over(l).split('\n').slice(1,5).join('\n')
};

   MOTOR
   ========================================================= */
const ctx={topic:null};
function best(map,n,stems){const out=[];for(const k in map){const s=score(map[k],n,stems);if(s>0)out.push([k,s])}return out.sort((a,b)=>b[1]-a[1])}
function pack(r,chips){return typeof r==='object'?{text:r.text,sos:r.sos,chips}:{text:r,chips}}
function respond(raw,l){
  const n=norm(raw), toks=n.trim().split(' ').filter(Boolean), stems=toks.map(stem), e=entities(n);
  const tp=best(TOPICS,n,stems), fc=best(FACETS,n,stems), it=best(INTENTS,n,stems);
  const TH=.9, topS=tp[0]?tp[0][1]:0, facS=fc[0]?fc[0][1]:0, intS=it[0]?it[0][1]:0;
  if(it[0]&&it[0][0]==='sos'&&intS>=2){ctx.topic=null;return pack(I.sos(l),CH[l].sos)}
  const small=['hello','thanks','bye','help'];
  if(intS>=TH){
    const id=it[0][0], isSmall=small.includes(id);
    const wins=intS>=Math.max(topS,facS)+(isSmall?.6:0)||(!isSmall&&topS<TH);
    if(wins&&!(isSmall&&(topS>=TH||facS>=TH))){
      if(id==='experience')ctx.topic='cab';
      return pack(I[id](l),(id==='help'||id==='who')?'TOPICS':(CH[l][id]||CH[l].gen));
    }
  }
  let topics=tp.filter(x=>x[1]>=TH).slice(0,2).map(x=>x[0]);
  let facets=fc.filter((x,i)=>x[1]>=(i?2:TH)).slice(0,2).map(x=>x[0]);
  if(e.age==null&&(e.adults||e.kids)&&facets.includes('age'))facets=facets.map(f=>f==='age'?'price':f).filter((f,i,a)=>a.indexOf(f)===i);
  if(e.age!=null&&!facets.includes('age')&&!facets.includes('price'))facets.unshift('age');
  if(!topics.length&&facets.length){
    const f=facets[0];
    if(ctx.topic&&T[ctx.topic][f])topics=[ctx.topic];
    else if(FACET_DEFAULT_TOPIC[f])topics=[FACET_DEFAULT_TOPIC[f]];
    else if(FACET_ONLY[f]){ctx.topic=null;return pack(FACET_ONLY[f](l,e),f==='incl'?CH[l].incl:CH[l].gen)}
  }
  if(e.month&&!facets.length&&topics.includes('cab'))facets=['season'];
  if(!topics.length&&!facets.length){
    if((e.people||e.adults||e.kids||e.age!=null||e.month)&&ctx.topic){topics=[ctx.topic];facets=[e.age!=null?'age':e.month?'season':'price']}
    else if(e.month||e.now){topics=['cab'];facets=['season']}
    else return fallback(l,it,tp);
  }
  const parts=[];
  for(const t of topics){const fs=facets.filter(f=>T[t][f]);if(!fs.length)parts.push(T[t].over(l,e));else fs.forEach(f=>parts.push(T[t][f](l,e)))}
  ctx.topic=topics[topics.length-1];
  return pack(parts.slice(0,3).join('\n\n— — —\n\n'),CH[l][ctx.topic]||CH[l].gen);
}
function fallback(l,it,tp){
  const map=P(l,{es:{cab:'Cuéntame de la cabalgata',domo:'¿Qué incluye el domo?',trans:'Transporte privado',food:'¿Qué comidas incluye?',weather:'¿Cómo es el clima?',pack:'¿Qué debo llevar?'},
    en:{cab:'Tell me about the horseback ride',domo:'What does the dome include?',trans:'Private transport',food:'What meals are included?',weather:'What’s the weather like?',pack:'What should I bring?'},
    pt:{cab:'Fale sobre a cavalgada',domo:'O que o domo inclui?',trans:'Transporte privado',food:'Quais refeições estão incluídas?',weather:'Como está o clima?',pack:'O que devo levar?'},
    zh:{cab:'介绍一下骑马',domo:'圆顶包括什么？',trans:'私人交通',food:'包含哪些餐食？',weather:'天气怎么样？',pack:'需要带什么？'}});
  const sug=[];[...tp,...it].forEach(([k])=>{if(map[k]&&!sug.includes(map[k]))sug.push(map[k])});
  return {text:P(l,{es:`Mmm, no estoy seguro de haber entendido 🤔. Puedo responder sobre los **domos**, la **cabalgata**, **precios**, **comidas**, **clima**, **qué llevar**, **transporte**, **normas** y **emergencias**.\n\nIntenta con otras palabras o elige un tema. Para algo más específico, consulta en recepción.`,
    en:`Hmm, I’m not sure I understood 🤔. I can answer about **domes**, the **horseback ride**, **prices**, **meals**, **weather**, **what to bring**, **transport**, **rules** and **emergencies**.\n\nTry other words or pick a topic. For anything more specific, ask at reception.`,
    pt:`Hmm, não tenho certeza se entendi 🤔. Posso responder sobre **domos**, **cavalgada**, **preços**, **refeições**, **clima**, **o que levar**, **transporte**, **regras** e **emergências**.\n\nTente com outras palavras ou escolha um tema. Para algo mais específico, consulte a recepção.`,
    zh:`抱歉，我不太确定您的意思 🤔。我可以回答关于**圆顶住宿**、**骑马**、**价格**、**餐食**、**天气**、**携带物品**、**交通**、**规定**和**紧急情况**的问题。\n\n请换个说法或选择一个主题。更具体的问题请咨询前台。`}),chips:sug.length?sug.slice(0,3):'TOPICS'};
}

const navL=(navigator.language||'es').toLowerCase();
let LANG=navL.startsWith('zh')?'zh':navL.startsWith('pt')?'pt':navL.startsWith('en')?'en':'es';
const log=document.getElementById('log'), q=document.getElementById('q'), form=document.getElementById('form');
const langBtn=document.getElementById('langBtn'), langMenu=document.getElementById('langMenu');
let history=[], busy=false;
const KEY='natura-chat-v2';
function save(){try{localStorage.setItem(KEY,JSON.stringify({lang:LANG,history:history.slice(-60),topic:ctx.topic}))}catch(_){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.history)&&s.history.length){LANG=LANGS.includes(s.lang)?s.lang:LANG;history=s.history;ctx.topic=s.topic||null;return true}}catch(_){}return false}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(s){return s.split('\n').map(line=>{
  const h=esc(line).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(US\$[\d,]+)/g,'<span class="num">$1</span>');
  if(/^• /.test(line))return `<div class="li"><span>${h.slice(2)}</span></div>`;
  if(line.trim()==='')return '<div class="gap"></div>';
  return `<div>${h}</div>`}).join('')}
function hhmm(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
const LEAF='<svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.2-6.1C9.6 14.4 12 13 13 11"/></svg>';
function renderMsg(m,animate){
  const row=document.createElement('div');row.className='row '+(m.who==='me'?'me':'bot')+(animate?' new':'');
  if(m.who==='me')row.innerHTML=`<span class="time">${hhmm(m.t)}</span><div class="bub">${esc(m.text)}</div>`;
  else row.innerHTML=`<span class="mini" aria-hidden="true">${LEAF}</span><div class="bub${m.sos?' sos':''}">${md(m.text)}</div><span class="time">${hhmm(m.t)}</span>`;
  log.appendChild(row);
}
function renderChips(chips){
  log.querySelectorAll('.chips,.topics').forEach(el=>el.remove());if(!chips)return;
  if(chips==='TOPICS'){const g=document.createElement('div');g.className='topics';
    g.innerHTML=UI[LANG].topics.map(([e,lb,qq,c])=>`<button type="button" class="topic${c?' '+c:''}" data-q="${esc(qq)}"><span class="e" aria-hidden="true">${e}</span>${esc(lb)}</button>`).join('');log.appendChild(g);return}
  const d=document.createElement('div');d.className='chips';
  d.innerHTML=chips.map(c=>`<button type="button" class="chip" data-q="${esc(c)}">${esc(c)}</button>`).join('');log.appendChild(d);
}
function scrollEnd(){requestAnimationFrame(()=>{log.scrollTop=log.scrollHeight})}
function renderAll(){
  log.innerHTML=`<div class="day">${UI[LANG].today}</div>`;history.forEach(m=>renderMsg(m,false));
  const last=[...history].reverse().find(m=>m.who==='bot');renderChips(last?last.chips:'TOPICS');scrollEnd();
}
function applyLang(){
  const u=UI[LANG];document.documentElement.lang=LANG==='zh'?'zh-CN':LANG==='pt'?'pt-BR':LANG;
  q.placeholder=u.ph;q.setAttribute('aria-label',u.ph);
  document.getElementById('status').textContent=u.status;document.getElementById('foot').textContent=u.foot;
  const r=document.getElementById('reset');r.setAttribute('aria-label',u.reset);r.title=u.reset;
  document.getElementById('sendBtn').setAttribute('aria-label',u.send);log.setAttribute('aria-label',u.today);
  document.getElementById('langCode').textContent=LANG==='zh'?'中文':LANG.toUpperCase();langBtn.setAttribute('aria-label',u.lang+': '+u.name);
  langMenu.innerHTML=LANGS.map(c=>`<button type="button" role="menuitemradio" aria-checked="${c===LANG}" data-setlang="${c}">${UI[c].name}<small>${c==='zh'?'中文':c.toUpperCase()}</small></button>`).join('');
}
function start(){history=[{who:'bot',text:UI[LANG].welcome(),t:Date.now(),chips:'TOPICS'}];ctx.topic=null;renderAll();save()}
function ask(text){
  text=text.trim();if(!text||busy)return;
  const dl=detectLang(norm(text),LANG);if(dl!==LANG){LANG=dl;applyLang()}
  const me={who:'me',text,t:Date.now()};history.push(me);renderChips(null);renderMsg(me,true);scrollEnd();
  q.value='';busy=true;
  let r;try{r=respond(text,LANG)}catch(err){r=fallback(LANG,[],[])}
  const typ=document.createElement('div');typ.className='row bot new';typ.innerHTML=`<span class="mini" aria-hidden="true">${LEAF}</span><div class="bub typing" aria-label="${esc(UI[LANG].typing)}"><i></i><i></i><i></i></div>`;
  log.appendChild(typ);scrollEnd();
  setTimeout(()=>{typ.remove();const m={who:'bot',text:r.text,sos:!!r.sos,t:Date.now(),chips:r.chips};history.push(m);renderMsg(m,true);renderChips(r.chips);scrollEnd();busy=false;save()},Math.min(450+r.text.length*2,1300));
}
function setLang(c){if(!LANGS.includes(c)||c===LANG){closeMenu();return}LANG=c;applyLang();closeMenu();if(history.length<=1)start();else{renderAll();save()}}
function closeMenu(){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false')}
langBtn.addEventListener('click',ev=>{ev.stopPropagation();const open=langMenu.hidden;langMenu.hidden=!open;langBtn.setAttribute('aria-expanded',String(open));if(open)langMenu.querySelector('[aria-checked="true"]').focus()});
langMenu.addEventListener('click',ev=>{const b=ev.target.closest('[data-setlang]');if(b)setLang(b.dataset.setlang)});
document.addEventListener('click',ev=>{if(!langMenu.hidden&&!ev.target.closest('.langwrap'))closeMenu()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!langMenu.hidden){closeMenu();langBtn.focus()}});
form.addEventListener('submit',ev=>{ev.preventDefault();ask(q.value)});
log.addEventListener('click',ev=>{const b=ev.target.closest('[data-q]');if(b)ask(b.dataset.q)});
document.getElementById('reset').addEventListener('click',()=>{start();q.focus()});

if(load()){applyLang();renderAll()}else{applyLang();start()}
window.__natura={respond,ctx,detectLang,norm,CH,UI,fallback};
})();
</script>
